
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Docker and Docker Compose from Ubuntu repository
  apt:
    name:
      - docker.io
      - docker-compose
      - python3-pip
    state: present

- name: Install Docker SDK for Python
  pip:
    name:
      - docker
      - docker-compose
    state: present

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Add user ubuntu to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
